<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PulseFit Academia (Tailwind)</title>

  <!-- Tailwind via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-neutral-950 text-neutral-100">

    <main id="conteudo">

    <section id="inicio" class="scroll-mt-20" aria-label="Destaques da academia">
      <h1 class="sr-only">PulseFit Academia com Tailwind CSS</h1>

    </section>

    <section id="planos" class="py-16 scroll-mt-20" aria-labelledby="titulo-planos">
      <div class="max-w-6xl mx-auto px-4">
        <h2 id="titulo-planos" class="text-3xl font-bold text-center mb-10">Nossos planos</h2>
      
    </div>
    </section>

    <section id="horarios" class="py-16 bg-neutral-900 scroll-mt-20" aria-labelledby="titulo-horarios">
      <div class="max-w-6xl mx-auto px-4">
        <h2 id="titulo-horarios" class="text-3xl font-bold text-center mb-10">Grade de aulas</h2>

    </div>
    </section>

    <section id="matricula" class="py-16 scroll-mt-20" aria-labelledby="titulo-matricula">
      <div class="max-w-6xl mx-auto px-4">
        <h2 id="titulo-matricula" class="text-3xl font-bold text-center mb-10">Agende sua aula experimental</h2>

    </div>
    </section>
  </main>

  <footer class="bg-black text-neutral-400 py-6 px-4 text-center text-sm">
    <p>2026 PulseFit Academia Tailwind</p>
  </footer>


  
  <script src="script.js"></script>
</body>
</html>
