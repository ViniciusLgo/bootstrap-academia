<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseFit Academia</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">


</head>
<body>
  <a href="#conteudo" class="visually-hidden-focusable">Pular para o conteúdo</a>

  <header class="sticky-top">
    <nav class="navbar navbar-expand-lg bg-black border-bottom border-warning" aria-label="Menu principal">
      <div class="container">
        <!-- Logo/nome do site -->
        <a class="navbar-brand fw-bold text-warning" href="#inicio">PulseFit</a>

        <!-- Botão 3 listras telefone -->
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false"
                aria-label="Abrir menu de navegação">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Conteudo no celular -->
        <div class="collapse navbar-collapse" id="menuPrincipal">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="#inicio">Início</a></li>
            <li class="nav-item"><a class="nav-link" href="#planos">Planos</a></li>
            <li class="nav-item"><a class="nav-link" href="#horarios">Horários</a></li>
            <li class="nav-item"><a class="nav-link" href="#matricula">Matrícula</a></li>
          </ul>
          <a class="btn btn-warning fw-semibold ms-lg-3 mb-2 mb-lg-0" href="#matricula">Aula grátis</a>
        </div>
      </div>
    </nav>
  </header>

  <main id="conteudo">
    <section id="inicio" aria-label="Destaques da academia">

    </section>

    <section id="planos" class="py-5" aria-labelledby="titulo-planos">
      <div class="container">
        <h2 id="titulo-planos" class="text-center mb-4">Nossos planos</h2>

    </div>
    </section>

    <section id="horarios" class="py-5 bg-body-tertiary" aria-labelledby="titulo-horarios">
      <div class="container">
        <h2 id="titulo-horarios" class="text-center mb-4">Grade de aulas</h2>

    </div>
    </section>

    <section id="matricula" class="py-5" aria-labelledby="titulo-matricula">
      <div class="container">
        <h2 id="titulo-matricula" class="text-center mb-4">Agende sua aula experimental</h2>

    </div>
    </section>
  </main>

  <footer class="bg-black text-white-50 py-4">
    <div class="container text-center">
      <p class="mb-0">2026 PulseFit Academia</p>
    </div>
  </footer>

  
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
